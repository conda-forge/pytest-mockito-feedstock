# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.7"
  python_check_max: "3.15"

package:
  name: pytest-mockito
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytest-mockito/pytest_mockito-${{ version }}.tar.gz
  sha256: 1763527520b2a0c7f25a91e1c2afa56ed44c4637ca163aa1ed65ef3bb67795bc

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatch-vcs
    - hatchling
    - pip
    - python ${{ python_min }}.*
  run:
    - mockito >=2.0.0
    - pytest >=6
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/pytest-mockito/**
      site_packages:
        - pytest_mockito/**
        - pytest_mockito-${{ version }}.dist-info/**
  - python:
      imports: pytest_mockito
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/**
    requirements:
      run:
        - coverage
        - python ${{ python_min }}.*
    script:
      - coverage run --source=pytest_mockito --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=80

about:
  summary: Base fixtures for mockito
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pytest-mockito
  repository: https://github.com/kaste/pytest-mockito.git

extra:
  recipe-maintainers:
    - bollwyvl
